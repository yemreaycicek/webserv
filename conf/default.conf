server {
    listen 127.0.0.1:8080;

    client_max_body_size 10m;

    error_page 404 /www/error_pages/404.html;

    location / {
        allow_methods GET POST DELETE;
        root ./www/html;
        index index.html;
        autoindex on;
    }

    location /old-site {
        return 301 /;
    }

    location /upload {
        allow_methods GET POST;
        root ./www/uploads;
        upload_enable on;
        upload_store ./www/uploads/files;
        autoindex on;
    }
	location /cgi/ {
    	cgi_extension .py;
    	cgi_pass /usr/bin/python3;
		root www;
	}
}
