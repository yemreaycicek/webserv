server {
    listen 127.0.0.1:8042;
    listen 127.0.0.1:8080;
    client_max_body_size 10m;

    error_page 403 /www/error_pages/403.html;
    error_page 404 /www/error_pages/404.html;
    error_page 405 /www/error_pages/405.html;
    error_page 413 /www/error_pages/413.html;
    error_page 500 /www/error_pages/500.html;
    error_page 504 /www/error_pages/504.html;

    location / {
        allow_methods GET POST DELETE;
        root ./www/html;
        index index.html;
		upload_enable off;
        autoindex off;
    }

    location /image {
        allow_methods GET;
        root ./www/image;
        autoindex on;
    }

    location /upload {
        allow_methods GET POST DELETE;
        root ./www/upload;
        upload_enable on;
        upload_store ./www/upload/files;
        autoindex on;
    }
    location /cgi {
        allow_methods GET POST;
        root ./www;
        cgi_extension .py;
        cgi_pass /usr/bin/python3;
    }

    location /old {
        return 301 /about.html;
    }
}
