<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>413 Content Too Large</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .box { padding: 2rem; }
  .code { font-size: 6rem; font-weight: 700; color: #5b9dd9; line-height: 1; letter-spacing: -2px; }
  .reason { font-size: 1.5rem; margin-top: 0.5rem; font-weight: 500; }
  .msg { margin-top: 1rem; color: #8a8f98; font-size: 1rem; }
  .server { margin-top: 2.5rem; font-size: 0.75rem; color: #3a3f48; text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">413</div>
    <div class="reason">Content Too Large</div>
    <p class="msg">Gönderdiğiniz içerik çok büyük.</p>
  </div>
</body>
</html>
